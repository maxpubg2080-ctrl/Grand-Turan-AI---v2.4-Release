services:
  - type: web
    name: grand-turan-ai
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DISABLE_HMR
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
